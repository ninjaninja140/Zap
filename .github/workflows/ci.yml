name: ci

on:
  push:
    paths:
      - "src/**"
      - "Cargo.toml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: test
        run: cargo test --release

      - name: build
        run: cargo build --release

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-${{ matrix.os }}
          path: |
            target/release/zap
            target/release/zap.exe
          if-no-files-found: error

  build-musl:
    name: build (linux musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: rust target
        run: rustup target add x86_64-unknown-linux-musl

      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-musl-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-musl-

      - name: test (musl)
        run: cargo test --release --target x86_64-unknown-linux-musl

      - name: build (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-linux-musl
          path: target/x86_64-unknown-linux-musl/release/zap
          if-no-files-found: error
