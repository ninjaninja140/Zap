name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  node-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      # build only, no publish flow yet
      - name: build zap+node image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: NODE_VERSION=${{ matrix.node }}
          tags: zap-node:${{ matrix.node }}-${{ github.sha }}
          cache-from: type=gha,scope=zap-node-${{ matrix.node }}
          cache-to: type=gha,scope=zap-node-${{ matrix.node }},mode=max

  registry-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build registry image
        uses: docker/build-push-action@v6
        with:
          context: ./registry
          push: false
          tags: zap-registry:${{ github.sha }}
          cache-from: type=gha,scope=zap-registry
          cache-to: type=gha,scope=zap-registry,mode=max
